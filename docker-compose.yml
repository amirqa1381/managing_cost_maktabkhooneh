services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-managing_cost}:${POSTGRES_PASSWORD:-managing_cost_password}@postgres:5432/${POSTGRES_DB:-managing_cost}
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-managing_cost}
      POSTGRES_USER: ${POSTGRES_USER:-managing_cost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-managing_cost_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-managing_cost} -d ${POSTGRES_DB:-managing_cost}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  locust:
    image: locustio/locust
    ports:
     - "8089:8089"
    volumes:
      - ./core/locust:/mnt/locust
    depends_on:
      - api
    command: -f /mnt/locust/locustfile.py -H http://api:8000

volumes:
  postgres_data:
  redis_data:
